<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的测试网站 🚀</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 50px 80px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        h1 { font-size: 48px; margin-bottom: 10px; }
        p { font-size: 20px; opacity: 0.9; }
        .status {
            margin-top: 20px;
            background: #00c853;
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-block;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>✅ 部署成功！</h1>
        <p>用户名：114514zyhs | 仓库：test web</p>
        <div class="status">🎉 Cloudflare 代理就绪</div>
    </div>
</body>
</html>
