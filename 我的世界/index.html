<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的世界网页版 · 版本选择</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f0f2f5;
            color: #1e1e1e;
        }
        h1 {
            font-size: 32px;
            font-weight: 600;
            border-bottom: 2px solid #d0d7de;
            padding-bottom: 12px;
            margin-bottom: 8px;
        }
        .sub {
            color: #57606a;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .nav-item {
            display: block;
            background: #ffffff;
            border: 1px solid #d0d7de;
            padding: 16px 20px;
            text-decoration: none;
            color: #0969da;
            font-weight: 500;
            transition: background 0.15s;
        }
        .nav-item:hover {
            background: #f6f8fa;
        }
        .nav-item .desc {
            display: block;
            font-weight: normal;
            font-size: 14px;
            color: #57606a;
            margin-top: 4px;
        }
        .tag {
            display: inline-block;
            font-size: 12px;
            font-weight: normal;
            padding: 1px 7px;
            margin-left: 6px;
            border-radius: 10px;
            background: #ddf4e4;
            color: #1a7f37;
            vertical-align: middle;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 14px;
            color: #8b949e;
            border-top: 1px solid #d0d7de;
            padding-top: 16px;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0d1117; color: #c9d1d9; }
            .nav-item { background: #161b22; border-color: #30363d; color: #58a6ff; }
            .nav-item:hover { background: #1c2128; }
            .nav-item .desc { color: #8b949e; }
            .tag { background: #1a7f37; color: #ddf4e4; }
            .footer { border-top-color: #30363d; color: #8b949e; }
            .sub { color: #8b949e; }
        }
        @media (max-width: 500px) {
            .nav-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>我的世界网页版</h1>
    <div class="sub">浏览器里直接玩，不用装任何东西 · 选择版本进入</div>

    <div class="nav-grid">
        <a href="/我的世界1.8.8/index.html" class="nav-item">
            1.8.8
            <span class="tag">推荐</span>
            <span class="desc">最新的稳定版 · 支持单机与联机 · 原版 1.8 体验</span>
        </a>
        <a href="/我的世界1.12.2/index.html" class="nav-item">
            1.12.2
            <span class="desc">较新版本 · 内容更多 · 加载相对慢一些</span>
        </a>
        <a href="/我的世界1.5.2/index.html" class="nav-item">
            1.5.2
            <span class="desc">经典老版本 · 体积最小 · 最稳定</span>
        </a>
    </div>

    <div class="footer">4444448.xyz · 114514ZYHS</div>
</body>
</html>
