<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下载站 - sjkh.cc.cd</title>
    <style>
        /* 整体直角风格，无圆角 */
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 920px;
            margin: 30px auto;
            padding: 0 20px;
            background: #f0f2f5;
            color: #1e1e1e;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 6px;
            border-bottom: 2px solid #d0d7de;
            padding-bottom: 12px;
        }
        .sub {
            color: #57606a;
            font-size: 15px;
            margin-top: -6px;
            margin-bottom: 24px;
        }
        .file-list {
            background: #ffffff;
            border: 1px solid #d0d7de;
            /* 无圆角 */
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid #e1e4e8;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .file-item:hover {
            background: #f6f8fa;
        }
        .file-info {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .file-ext {
            display: inline-block;
            background: #e9ecef;
            padding: 2px 10px;
            font-size: 13px;
            font-weight: 500;
            color: #24292e;
            font-family: monospace;
        }
        .file-name {
            font-weight: 500;
            color: #0969da;
            text-decoration: none;
            font-size: 16px;
        }
        .file-name:hover {
            text-decoration: underline;
        }
        .file-size {
            color: #57606a;
            font-size: 14px;
        }
        .download-btn {
            background: #2da44e;
            color: #fff;
            border: none;
            padding: 6px 18px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
            /* 直角 */
            border-radius: 0;
            transition: background 0.15s;
        }
        .download-btn:hover {
            background: #22863a;
        }
        .loading, .empty, .error {
            padding: 40px 20px;
            text-align: center;
            color: #57606a;
            font-size: 16px;
        }
        .error {
            color: #cf222e;
        }
        .footer {
            margin-top: 28px;
            text-align: center;
            font-size: 14px;
            color: #8b949e;
            border-top: 1px solid #d0d7de;
            padding-top: 16px;
        }
        code {
            background: #e9ecef;
            padding: 2px 8px;
            font-size: 14px;
            border-radius: 0;
        }
        /* 暗黑模式适配（保持直角） */
        @media (prefers-color-scheme: dark) {
            body { background: #0d1117; color: #c9d1d9; }
            .file-list { background: #161b22; border-color: #30363d; }
            .file-item { border-bottom-color: #21262d; }
            .file-item:hover { background: #1c2128; }
            .file-name { color: #58a6ff; }
            .file-size { color: #8b949e; }
            .download-btn { background: #238636; }
            .download-btn:hover { background: #2ea043; }
            .footer { border-top-color: #30363d; color: #8b949e; }
            .sub { color: #8b949e; }
            .file-ext { background: #21262d; color: #c9d1d9; }
            code { background: #21262d; }
        }
    </style>
</head>
<body>
    <h1>下载仓库</h1>
    <div class="sub">文件存放于 <code>download</code> 文件夹，页面自动刷新列表</div>

    <div id="fileContainer" class="file-list">
        <div class="loading">正在扫描文件列表...</div>
    </div>
    <div class="footer">114514zyhs · GitHub Pages</div>

    <script>
        (function() {
            const USERNAME = '114514zyhs';
            const REPO = 'test';
            const FOLDER = 'download';
            const container = document.getElementById('fileContainer');

            async function fetchFiles() {
                try {
                    const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FOLDER}`;
                    const resp = await fetch(apiUrl);

                    if (resp.status === 404) {
                        container.innerHTML = `<div class="empty">文件夹 download 尚未创建或为空，请先在仓库中建立该目录并上传文件。</div>`;
                        return;
                    }
                    if (!resp.ok) {
                        throw new Error(`API请求失败 (HTTP ${resp.status})`);
                    }
                    const data = await resp.json();
                    if (!Array.isArray(data)) {
                        throw new Error('返回数据格式异常');
                    }

                    const files = data.filter(item => item.type === 'file');
                    if (files.length === 0) {
                        container.innerHTML = `<div class="empty">当前没有任何文件，请上传文件到 download 文件夹。</div>`;
                        return;
                    }

                    // 按最近上传（SHA 变化）排序，大致越新越靠前
                    files.sort((a, b) => (b.sha || '').localeCompare(a.sha || ''));

                    let html = '';
                    files.forEach(file => {
                        const size = file.size;
                        let sizeStr = '';
                        if (size < 1024) sizeStr = size + ' B';
                        else if (size < 1024 * 1024) sizeStr = (size / 1024).toFixed(1) + ' KB';
                        else sizeStr = (size / (1024 * 1024)).toFixed(2) + ' MB';

                        const ext = (file.name.split('.').pop() || '').toLowerCase();
                        // 使用纯文本表示文件类型
                        let typeLabel = ext.toUpperCase() || '文件';
                        if (['zip','rar','7z','gz','bz2'].includes(ext)) typeLabel = '压缩包';
                        else if (['exe','msi','dmg','pkg','deb','rpm'].includes(ext)) typeLabel = '程序';
                        else if (['pdf'].includes(ext)) typeLabel = 'PDF';
                        else if (['jpg','jpeg','png','gif','webp','bmp','svg'].includes(ext)) typeLabel = '图片';
                        else if (['mp4','mkv','avi','mov','wmv','flv','webm'].includes(ext)) typeLabel = '视频';
                        else if (['mp3','wav','flac','aac','ogg'].includes(ext)) typeLabel = '音频';
                        else if (['txt','md','log'].includes(ext)) typeLabel = '文本';

                        // 下载链接使用当前域名下的 /download/ 路径
                        const downloadUrl = `/download/${encodeURIComponent(file.name)}`;

                        html += `
                            <div class="file-item">
                                <div class="file-info">
                                    <span class="file-ext">${typeLabel}</span>
                                    <a href="${downloadUrl}" class="file-name" target="_blank">${file.name}</a>
                                    <span class="file-size">(${sizeStr})</span>
                                </div>
                                <a href="${downloadUrl}" class="download-btn" download>下载</a>
                            </div>
                        `;
                    });

                    container.innerHTML = html;

                } catch (err) {
                    console.error(err);
                    container.innerHTML = `<div class="error">加载失败：${err.message}<br><span style="font-size:14px;">请检查仓库名、文件夹名是否正确，或稍后重试。</span></div>`;
                }
            }

            fetchFiles();
        })();
    </script>
</body>
</html>
